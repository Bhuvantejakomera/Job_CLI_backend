[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "queuectl"
version = "0.1.0"
description = "CLI background job queue for the QueueCTL backend assignment"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
queuectl = "queuectl.cli:main"

[tool.setuptools]
packages = ["queuectl"]

